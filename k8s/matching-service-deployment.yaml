apiVersion: apps/v1
kind: Deployment
metadata:
  name: matching-service
  namespace: devconnect
spec:
  replicas: 2
  selector:
    matchLabels:
      app: matching-service
  template:
    metadata:
      labels:
        app: matching-service
    spec:
      containers:
      - name: matching-service
        image: devconnect/matching-service:latest
        ports:
        - containerPort: 3004
        env:
        - name: PORT
          value: "3004"
        - name: NODE_ENV
          value: production
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"
---
apiVersion: v1
kind: Service
metadata:
  name: matching-service
  namespace: devconnect
spec:
  selector:
    app: matching-service
  ports:
  - protocol: TCP
    port: 3004
    targetPort: 3004

