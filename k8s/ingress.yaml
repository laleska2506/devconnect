apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: devconnect-ingress
  namespace: devconnect
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  ingressClassName: nginx
  rules:
  - host: devconnect.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: frontend
            port:
              number: 80
      - path: /api/auth
        pathType: Prefix
        backend:
          service:
            name: auth-service
            port:
              number: 3001
      - path: /api/profiles
        pathType: Prefix
        backend:
          service:
            name: profiles-service
            port:
              number: 3002
      - path: /api/projects
        pathType: Prefix
        backend:
          service:
            name: projects-service
            port:
              number: 3003
      - path: /api/matches
        pathType: Prefix
        backend:
          service:
            name: matching-service
            port:
              number: 3004
      - path: /api/payments
        pathType: Prefix
        backend:
          service:
            name: payments-service
            port:
              number: 3005

